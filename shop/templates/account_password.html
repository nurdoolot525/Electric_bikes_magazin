{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'static_css/account.css' %}">
<link rel="stylesheet" href="{% static 'static_css/media.css' %}">
<main>
    <section class="account_section">
        <div class="container">
            <div class="account_grid">
                <div class="account_sidebar">
                    <h2>Мой аккаунт</h2>
                    <nav class="account_nav">
                        <a href="{% url 'account_orders' %}">История заказов</a>
                        <a href="{% url 'account_profile' %}">Персональные данные</a>
                        <a href="{% url 'account_password' %}" class="active">Смена пароля</a>
                        <a href="{% url 'account_wishlist' %}">Список желаний</a>
                        <a href="{% url 'logout' %}" class="account_logout">Выйти</a>
                    </nav>
                </div>

                <div class="account_content">
                    <h1>СМЕНА ПАРОЛЯ</h1>

                    {% if error %}<p class="auth_error">{{ error }}</p>{% endif %}
                    {% if success %}<p class="auth_success">{{ success }}</p>{% endif %}

                    <form method="post" class="account_form">
                        {% csrf_token %}

                        <div class="account_field">
                            <label>Текущий пароль</label>
                            <input type="password" name="old_password" required>
                        </div>
                        <div class="account_field">
                            <label>Новый пароль</label>
                            <input type="password" name="new_password" required>
                        </div>
                        <div class="account_field">
                            <label>Повторите новый пароль</label>
                            <input type="password" name="new_password2" required>
                        </div>

                        <button type="submit" class="account_save_btn">Изменить пароль</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}
