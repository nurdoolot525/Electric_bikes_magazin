{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'static_css/auth.css' %}">
<main>
    <section class="auth_section">
        <div class="container">
            <div class="auth_form_wrap">
                <h1>РЕГИСТРАЦИЯ</h1>

                {% if error %}
                <p class="auth_error">{{ error }}</p>
                {% endif %}

                <form method="post" class="auth_form">
                    {% csrf_token %}

                    <label>Логин</label>
                    <input type="text" name="username" required>

                    <label>E-mail</label>
                    <input type="email" name="email" required>

                    <label>Пароль</label>
                    <input type="password" name="password" required>

                    <label>Повторите пароль</label>
                    <input type="password" name="password2" required>

                    <button type="submit">Зарегистрироваться</button>
                </form>

                <p class="auth_switch">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
            </div>
        </div>
    </section>
</main>
{% endblock %}
